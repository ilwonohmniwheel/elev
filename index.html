<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>승강기기능사 실기 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6EAED; --surface:#FFFFFF; --paper:#F7F9F8; --grid:#E3E9E7;
  --ink:#1E2F3E; --ink-soft:#5A6A77; --line:#CBD3D9;
  --steel:#CDD3D8; --steel-edge:#98A3AC; --duct:#B9C2C9; --part:#F3F5F6; --part-edge:#5F6D78; --screw:#EDF0F2;
  --sel:#1C5FD4; --sel-bg:#E3ECFB;
  --ok:#2B8A4B; --ok-bg:#E2F3E7; --bad:#C9322A; --bad-bg:#FBE5E3;
  --w-R:#8A4B22; --w-S:#1A1A1A; --w-T:#8C949B; --w-PE:#2E9A4A; --w-ctrl:#E6B400; --w-ctrl-ink:#C39200;
  --halo:rgba(20,30,40,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#161F27; --paper:#131C24; --grid:#1C2832;
    --ink:#DCE6EE; --ink-soft:#91A1AE; --line:#2A3743;
    --steel:#2A333C; --steel-edge:#3E4B56; --duct:#35414C; --part:#1D262E; --part-edge:#8A98A4; --screw:#2E3943;
    --sel:#6EA1FF; --sel-bg:#172A4A;
    --ok:#4CC074; --ok-bg:#14301E; --bad:#FF6B5E; --bad-bg:#3A1714;
    --w-S:#050505; --w-ctrl-ink:#E6B400; --halo:rgba(230,236,240,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F27; --paper:#131C24; --grid:#1C2832;
  --ink:#DCE6EE; --ink-soft:#91A1AE; --line:#2A3743;
  --steel:#2A333C; --steel-edge:#3E4B56; --duct:#35414C; --part:#1D262E; --part-edge:#8A98A4; --screw:#2E3943;
  --sel:#6EA1FF; --sel-bg:#172A4A;
  --ok:#4CC074; --ok-bg:#14301E; --bad:#FF6B5E; --bad-bg:#3A1714;
  --w-S:#050505; --w-ctrl-ink:#E6B400; --halo:rgba(230,236,240,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1560px;margin:0 auto;padding:20px 16px 40px}
.top h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.top p{margin:4px 0 16px;color:var(--ink-soft);max-width:70ch}

.problem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.problem h2{margin:0;font-size:17px;font-weight:700}
.problem details{margin-top:6px}
.problem summary{cursor:pointer;color:var(--sel);font-weight:600;width:max-content}
.problem ul,.problem ol{margin:8px 0 4px;padding-left:22px;max-width:84ch}
.problem li{margin:2px 0}
.problem .ops{margin:8px 0 0;padding-left:22px;max-width:100ch;font-size:14px}
.problem .ops li{margin:3px 0}
.problem .note{margin:8px 0 0;font-size:13px;color:var(--ink-soft);max-width:100ch}

.probs{margin-bottom:12px}
.pgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.pgroup{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.pgroup.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.pgroup h3{margin:0;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pgroup h3 .rng{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.pgroup p{margin:4px 0 8px;font-size:13px;color:var(--ink-soft);line-height:1.45}
.ptag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin-right:8px;vertical-align:2px}
.probs-cap{font-size:13px;font-weight:600;color:var(--ink-soft);min-width:128px}
.probs-list button:disabled{cursor:not-allowed;opacity:.45;border-style:dashed}
.probs-list{display:flex;gap:6px;flex-wrap:wrap}
.probs-list button{flex:1 1 auto}
.probs-list button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.probs-list button .pn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--bg);font-size:13px}
.probs-list button[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.probs-list button[aria-current="true"] .pn{background:var(--ink);color:var(--surface)}
.probs-list button .pt{font-weight:500;color:var(--ink-soft)}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);
  padding:10px 16px 10px 10px;border-radius:999px;cursor:pointer;font-weight:600}
.steps .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);font-size:13px;font-weight:700}
.steps .cnt{font-weight:500;font-size:13px;color:var(--ink-soft)}
.steps button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps button[aria-selected="true"] .n{border-color:var(--surface)}
.steps button[aria-selected="true"] .cnt{color:inherit;opacity:.75}
.steps button:focus-visible,.btn:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.work{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;align-items:start}
.work.wire{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.work.big{grid-template-columns:1fr}
@media (max-width:1180px){.work{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.pane-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pane-bar h3{margin:0;font-size:15px;font-weight:700}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scroll{overflow-x:auto;border-radius:6px;border:1px solid var(--line)}
#sch{display:block;width:100%;min-width:860px;height:auto;background:var(--paper)}
.status{margin:10px 2px 0;font-size:14px;color:var(--ink-soft);min-height:1.6em}
.status b{color:var(--ink)} .status .good{color:var(--ok);font-weight:600}

/* schematic */
#sch text{font-family:inherit}
#sch .sym line,#sch .sym path,#sch .sym rect,#sch .sym circle{stroke:var(--ink);stroke-width:1.5;fill:none}
#sch .sym .fillp{fill:var(--paper)}
#sch .sym .term{fill:var(--paper);stroke-width:1.2}
#sch .sym .dash{stroke-dasharray:4 3;stroke-width:1.1}
#sch .sym .lampYL{fill:rgba(230,180,0,.28)} #sch .sym .lampRL{fill:rgba(220,60,50,.2)} #sch .sym .lampGL{fill:rgba(40,160,80,.2)} #sch .sym .lampWL{fill:rgba(150,160,170,.18)}
#sch .ext{stroke:var(--ink-soft);stroke-width:1.4;fill:none;stroke-dasharray:3 2}
#sch .jn{fill:var(--ink)}
#sch .lbl{fill:var(--ink);font-size:12px;font-weight:600;stroke:none}
#sch .lbl.c{text-anchor:middle}
#sch .lbl.sm{font-size:10px}
#sch .tag{fill:var(--ink-soft);font-size:9.5px;font-weight:600}
.w .vis{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linejoin:round}
.w .hit{stroke:transparent;stroke-width:13;fill:none;stroke-linejoin:round}
.mode-pins .w{pointer-events:none}
.mode-wire .w{cursor:pointer}
.mode-wire .w:hover .vis{stroke:var(--sel);stroke-width:3}
.w.on .vis{stroke-width:3}
.w.on.t-R .vis{stroke:var(--w-R)} .w.on.t-S .vis{stroke:var(--w-S)} .w.on.t-T .vis{stroke:var(--w-T)}
.w.on.t-PE .vis{stroke:var(--w-PE)} .w.on.t-ctrl .vis{stroke:var(--w-ctrl-ink)}
.w.hint .vis{stroke:var(--sel);stroke-width:3;stroke-dasharray:7 5;animation:march .8s linear infinite}
.w.sel .vis{stroke:var(--sel);stroke-width:4.2;stroke-dasharray:none}
@keyframes march{to{stroke-dashoffset:-12}}
.slot{cursor:pointer;outline:none}
.slot rect{fill:var(--surface);stroke:var(--ink-soft);stroke-width:1.1;stroke-dasharray:3 2}
.slot text{font-size:11px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.slot:hover rect,.slot:focus-visible rect{stroke:var(--sel);stroke-dasharray:none;stroke-width:1.8}
.slot.active rect{stroke:var(--sel);stroke-width:2.2;fill:var(--sel-bg);stroke-dasharray:none}
.slot.ok rect{fill:var(--ok-bg);stroke:var(--ok);stroke-dasharray:none} .slot.ok text{fill:var(--ok)}
.slot.bad rect{fill:var(--bad-bg);stroke:var(--bad);stroke-dasharray:none} .slot.bad text{fill:var(--bad)}
.pinlbl{font-size:10.5px;font-weight:700;fill:#D0306A;text-anchor:middle}

/* side cards */
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}
.card h4{margin:0 0 4px;font-size:15px}
.card p{margin:4px 0;font-size:14px;max-width:66ch}
.card .warn{color:var(--bad);font-weight:600}
.card.now{border-left:4px solid var(--sel)}
.refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.refs{grid-template-columns:1fr}}
.ref{border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px}
.ref.active{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel) inset}
.ref header{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}
.ref h4{margin:0;font-size:14px} .ref header span{font-size:12px;color:var(--ink-soft)}
.sock{width:100%;height:auto;display:block;margin:2px 0 6px;color:var(--ink)}
.sock text{font-family:inherit}
.sock .base{fill:var(--part);stroke:var(--part-edge);stroke-width:1.6}
.sock .hole{fill:var(--paper);stroke:var(--part-edge);stroke-width:1.4}
.sock .frame{fill:none;stroke:var(--part-edge);stroke-width:1.2}
.sock .pn circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.sock .pn text{font-size:12px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.sock .pn.hl circle{fill:var(--sel);stroke:var(--sel)}
.sock .pn.hl text{fill:#fff}
.sock .it path,.sock .it line,.sock .it circle.c{fill:none;stroke:var(--c);stroke-width:1.8;stroke-linejoin:round}
.sock .it .t{fill:var(--paper);stroke:var(--c);stroke-width:1.4}
.sock .it text{fill:var(--c);font-size:10px;font-weight:700}
.sock .it.on path,.sock .it.on line,.sock .it.on circle.c{stroke-width:3.4}
.sock .it.on text{font-size:11px}
.sock .ink{stroke:var(--ink);fill:none;stroke-width:1.4}
.sock .sub{font-size:9.5px;fill:var(--ink-soft);text-anchor:middle}
.sock .num{font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle}
.strip{display:grid;gap:3px;margin:0 0 8px;font-size:11.5px;font-weight:700;text-align:center}
.strip span{border:1px solid var(--line);border-radius:4px;padding:1px 0;background:var(--paper)}
.strip span.hl{background:var(--sel);color:#fff;border-color:var(--sel)}
.strip-cap{font-size:11.5px;color:var(--ink-soft);margin:0 0 3px}
.ref .rnote{font-size:12px;color:var(--ink-soft);margin:4px 2px 0}
.ref li i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ref ul{list-style:none;margin:0;padding:0;font-size:13px}
.ref li{padding:2px 6px;border-radius:5px}
.ref li b{font-weight:700;margin-right:5px}
.ref li:hover{background:var(--sel-bg)}
.ref li.on{background:var(--sel-bg);color:var(--sel);font-weight:600}

/* panel */
.panelwrap{overflow:auto;border-radius:6px}
#panel{display:block;width:100%;height:auto;margin:0 auto}
.work.big #panel{max-width:1000px}
#panel text{font-family:inherit}
.plate{fill:var(--steel);stroke:var(--steel-edge);stroke-width:.8}
.duct{fill:var(--duct);opacity:.45}
.part{fill:var(--part);stroke:var(--part-edge);stroke-width:.6}
.ptxt{fill:var(--ink);font-size:8px;font-weight:700;text-anchor:middle;opacity:.55}
.tbtxt{fill:var(--ink);font-size:3.5px;font-weight:600;text-anchor:middle}
.tbsub{fill:var(--ink-soft);font-size:3.2px;text-anchor:middle}
.tbdiv{stroke:var(--part-edge);stroke-width:.3}
.pin circle{fill:var(--screw);stroke:var(--part-edge);stroke-width:.45}
.pin text{font-size:3.3px;font-weight:700;text-anchor:middle;fill:var(--ink);pointer-events:none}
.pin.blank circle{opacity:.35}
.pin.hl circle{fill:var(--sel-bg);stroke:var(--sel);stroke-width:1}
.pw{cursor:pointer}
.pw .halo{stroke:var(--halo);fill:none;stroke-linejoin:round;stroke-linecap:round}
.pw .core{fill:none;stroke-linejoin:round;stroke-linecap:round}
.pw .stripe{fill:none;stroke:#E8C800;stroke-dasharray:1.6 1.6;stroke-linejoin:round}
.pw.t-R .core{stroke:var(--w-R)} .pw.t-S .core{stroke:var(--w-S)} .pw.t-T .core{stroke:var(--w-T)}
.pw.t-PE .core{stroke:var(--w-PE)} .pw.t-ctrl .core{stroke:var(--w-ctrl)}
.has-sel .pw:not(.sel){opacity:.3}
.pw.sel .halo{stroke:var(--sel)}
.pw.fresh path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out forwards}
.pw.fresh .stripe{stroke-dasharray:none}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--ink-soft);align-items:center}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px;box-shadow:0 0 0 1px var(--halo)}
.info .chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);margin:2px 6px 4px 0}
.info h4{font-size:17px}
.info .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rules{font-size:13.5px;color:var(--ink-soft)}
.rules ul{margin:4px 0 0;padding-left:18px}
.rules li{margin:1px 0}
.rules b{color:var(--ok)}

/* keypad */
.keypad{position:fixed;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px;width:228px}
.kp-head{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:6px}
.kp-head span{font-weight:500;color:var(--ink-soft)}
.kp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp-grid button,.kp-foot button{height:40px;border:1px solid var(--line);border-radius:7px;background:var(--paper);cursor:pointer;font-weight:700;font-size:15px}
.kp-grid button:hover,.kp-grid button:focus-visible{border-color:var(--sel);background:var(--sel-bg);outline:none}
.kp-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.kp-foot button{font-size:13px;font-weight:600;height:34px}
@media (prefers-reduced-motion:reduce){
  .w.hint .vis{animation:none}
  .pw.fresh path{animation:none;stroke-dashoffset:0}
}
:root{--w-main:#C9322A;--w-ctrl:#2563C9;--w-ctrl-ink:#2563C9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--w-main:#F0645A;--w-ctrl:#5B8FF0;--w-ctrl-ink:#7BA6F5}}
:root[data-theme="dark"]{--w-main:#F0645A;--w-ctrl:#5B8FF0;--w-ctrl-ink:#7BA6F5}
.w.on.t-main .vis{stroke:var(--w-main)}
.pw.t-main .core{stroke:var(--w-main)}
.pw.t-ctrl .core{stroke:var(--w-ctrl)}
#panel .stub{stroke:var(--w-main);stroke-width:1.7;fill:none;opacity:.55;stroke-linecap:round}
#panel .tblab{font-size:5.5px;font-weight:700;text-anchor:middle;fill:var(--ink-soft)}
#panel .note{font-size:6.5px;fill:var(--ink-soft)}
#panel .cbox{fill:#3A4148;stroke:#22282D;stroke-width:.8}
#panel .lampc{stroke:#22282D;stroke-width:1.2;opacity:.92}
#panel .pbring{fill:#CDD3D8;stroke:#22282D;stroke-width:.8}
#panel .btxt{font-size:7px;font-weight:700;text-anchor:middle;fill:#fff}
#panel .sockc{fill:none;stroke:var(--part-edge);stroke-width:.6;opacity:.6}
#panel .sockk{fill:none;stroke:var(--part-edge);stroke-width:.6;opacity:.6}
/* 와이어로프 그림 */
#rope{display:block;width:100%;min-width:720px;height:auto;background:var(--paper)}
#rope text{font-family:inherit}
#rope .steelp{fill:var(--steel);stroke:var(--ink);stroke-width:2}
#rope .hole2{fill:var(--paper);stroke:var(--ink);stroke-width:2}
#rope .win{fill:var(--paper);stroke:var(--ink);stroke-width:2}
#rope .petal{fill:#B9C2C9;stroke:var(--ink);stroke-width:1.4}
#rope .ropebg{fill:#AEB7BF}
#rope .ropeln{stroke:#5E6872;stroke-width:3}
#rope .rope{stroke:var(--ink);stroke-width:2}
#rope .bindw{fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-dasharray:4 3}
#rope .tagp{fill:#FFF6C8;stroke:var(--ink);stroke-width:1.6}
#rope .tapep{fill:#2A2F35;stroke:var(--ink);stroke-width:1.6}
#rope .lead{fill:none;stroke:var(--ink-soft);stroke-width:1.4}
#rope .mark{fill:none;stroke:transparent;stroke-width:3}
#rope .dimln{fill:none;stroke:var(--ink-soft);stroke-width:1.6}
#rope .ct{fill:var(--ink);font-size:14px;font-weight:600}
#rope .ct.m{text-anchor:middle} #rope .ct.e{text-anchor:start}
#rope .ct.sub{font-size:12px;font-weight:500;fill:var(--ink-soft)}
#rope .ct.sm{font-size:12px}
#rope .call.on .ct{fill:var(--sel)}
#rope .call.on .lead,#rope .call.on .dimln{stroke:var(--sel);stroke-width:2.4}
#rope .call.on .mark{stroke:var(--sel);stroke-dasharray:6 4}
#rope .call.on .petal,#rope .call.on .tagp{stroke:var(--sel);stroke-width:2.4}
#rope .call.on .bindw{stroke:var(--sel);stroke-width:3}
#rope .call.on .tapep{stroke:var(--sel);stroke-width:3}
/* 점검 문제 */
.qg{margin:14px 0 6px;font-size:14px;color:var(--ink-soft)}
.qcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface);cursor:pointer}
.qcard.cur{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel) inset}
.qcard.ok{border-left:4px solid var(--ok)} .qcard.bad{border-left:4px solid var(--bad)}
.qq{margin:0 0 8px;font-weight:600;font-size:14.5px}
.opts{display:grid;gap:5px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--sel);background:var(--sel-bg)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.qex{margin:8px 0 0;font-size:13.5px;color:var(--ink-soft)}
.qex b{color:var(--ink)}
.opt:focus-visible,.qcard:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px">
      <h1>승강기기능사 실기 연습장</h1>
      <button class="btn" id="resetAll" title="이 브라우저에 저장된 내 진도를 모두 지웁니다">처음부터 다시 하기</button>
    </div>

/* ================= 도면 기호 ================= */
const L=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${c?` class="${c}"`:''}/>`;
const term=(x,y)=>`<circle class="term" cx="${x}" cy="${y}" r="2.3"/>`;
const T_=(x,y,s,c='lbl')=>`<text class="${c}" x="${x}" y="${y}">${s}</text>`;
/* 제어회로 접점: 공개문제 도면 방식
   a접점: 단자 o o 오른쪽에 떨어진 막대 / b접점: 단자 왼쪽에 닿은 막대
   타이머 한시: 막대 오른쪽에 붙은 ">" 표시 / 플리커(FR): 막대 위에 걸친 검은 마름모
   푸시버튼: 막대 가운데에서 오른쪽으로 뻗은 짧은 가로선 */
function contact(x,y1,y2,type,o={}){
  const st=Math.min(10,(y2-y1)/4), t1=y1+st, t2=y2-st, my=(t1+t2)/2, isA=type==='a';
  const bx = isA ? x+7 : x-3.3;
  let s=L(x,y1,x,t1)+L(x,t2,x,y2)+L(bx,t1-2.6,bx,t2+2.6);
  if(o.pb) s+=L(bx,my,bx+6,my);
  if(o.timer) s+=`<path d="M${bx} ${my-2.6} L${bx+4.2} ${my} L${bx} ${my+2.6}" fill="none"/>`;
  if(o.flicker) s+=`<path d="M${bx-4.2} ${my} L${bx} ${my-2.8} L${bx+4.2} ${my} L${bx} ${my+2.8} Z" style="fill:var(--ink);stroke:var(--ink)"/>`;
  if(o.eocr) s+=L(bx-2.6,my-2.6,bx+2.6,my+2.6)+L(bx-2.6,my+2.6,bx+2.6,my-2.6);
  s+=term(x,t1)+term(x,t2);
  if(o.label) s+=T_(x+(o.lx||15),my+5,o.label);
  return s;
}
/* 윗줄 전원선 위의 가로 접점 (b접점: 단자 아래에 닿은 막대 / 푸시버튼: 막대 가운데에서 위로 짧은 세로선) */
function hContact(x1,x2,type,o={}){
  const a=x1+10, b=x2-10, m=(a+b)/2, by = type==='b' ? 43.3 : 33;
  let s=L(x1,40,a,40)+L(b,40,x2,40)+L(a-2.6,by,b+2.6,by);
  if(o.eocr) s+=L(m-2.6,by-2.6,m+2.6,by+2.6)+L(m-2.6,by+2.6,m+2.6,by-2.6);
  if(o.pb) s+= type==='b' ? L(m,by,m,37.3) : L(m,by,m,by-6);
  s+=term(a,40)+term(b,40);
  if(o.label) s+=T_(m,22,o.label,'lbl c sm');
  return s;
}
function mainContact(x,y1,y2){
  const st=Math.min(10,(y2-y1)/4);
  return L(x,y1,x,y1+st)+L(x,y2-st,x,y2)+L(x,y2-st,x+11,y1+st+3)+term(x,y1)+term(x,y2);

const ROUTE = {};
(function route(){
  const plans = WIRES.map(w=>{
    const A=PIN[w.a], B=PIN[w.b];
    if(!A||!B) throw new Error('단자 없음: '+w.a+' / '+w.b);
    if (A.box && A.box===B.box) return {w,A,B,inbox:true};
    if (A.ch===B.ch) return {w,A,B,segs:[{ch:A.ch,x1:A.x,x2:B.x}]};
    const side = (A.x+B.x)/2 <= BW/2 ? 'L':'R';
    return {w,A,B,side,segs:[{ch:A.ch,x1:A.x,x2:null,end:side},{ch:B.ch,x1:B.x,x2:null,end:side}]};
  });
  const bych = {top:[],bot:[]};
  plans.forEach(p=>(p.segs||[]).forEach(s=>bych[s.ch].push({p,s})));
  for (const side of ['L','R']){
    const list = plans.filter(p=>p.side===side).sort((a,b)=>Math.abs(a.A.x-a.B.x)-Math.abs(b.A.x-b.B.x));
    const [lo,hi] = MARGIN[side], n=list.length;
    list.forEach((p,i)=>{ const f=(i+1)/(n+1); p.mx = side==='L' ? hi-(hi-lo)*f : lo+(hi-lo)*f; });
  }
  plans.forEach(p=>(p.segs||[]).forEach(s=>{ if(s.x2==null) s.x2=p.mx; }));
  for (const ch of Object.keys(bych)){
    const list = bych[ch].sort((a,b)=>Math.abs(a.s.x1-a.s.x2)-Math.abs(b.s.x1-b.s.x2));
    const [lo,hi]=CH[ch], n=list.length;
    list.forEach((o,i)=>{ o.s.y = lo+(hi-lo)*(i+.5)/n; });
  }
  const boxK={};
  plans.forEach(p=>{
    let pts, desc;
    if (p.inbox){
      const dir = p.A.ch==='top' ? -1 : 1, k=(boxK[p.A.box]=(boxK[p.A.box]||0)+1);
      const y = p.A.y + dir*(4+2*k);
      pts=[[p.A.x,p.A.y],[p.A.x,y],[p.B.x,y],[p.B.x,p.B.y]]; desc='컨트롤 박스 안 점퍼';
    } else {
      const [s1,s2]=p.segs;
      if (!p.side){ pts=[[p.A.x,p.A.y],[p.A.x,s1.y],[p.B.x,s1.y],[p.B.x,p.B.y]]; desc=CH_NAME[s1.ch]; }
      else { pts=[[p.A.x,p.A.y],[p.A.x,s1.y],[p.mx,s1.y],[p.mx,s2.y],[p.B.x,s2.y],[p.B.x,p.B.y]];
        desc=`${CH_NAME[s1.ch]} → ${p.side==='L'?'왼쪽':'오른쪽'} 가장자리 → ${CH_NAME[s2.ch]}`; }
    }
    ROUTE[p.w.id]={d:'M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L'),desc};
  });
})();

  return `<svg class="sock" viewBox="0 0 300 228" aria-hidden="true">${o}</svg>`;
}
function refCard(k){
  const r=REF[k];
  const active=!!(sel.slot && REF_OF[EL[sel.slot.id].comp]===k);
  const ans=active?EL[sel.slot.id].ans:[];
  const hl=new Set(ans), key=[...ans].sort((a,b)=>a-b).join();
  const on=pins=> active && (pins.length===1 ? hl.has(pins[0]) && ans.length===3 : [...pins].sort((a,b)=>a-b).join()===key);
  const svg = r.kind==='12핀' ? draw12(k,on,hl) : draw8(k,on,hl);
  const cols=r.rows[0].length;
  const strip=`<p class="strip-cap">소켓 단자 배치 (윗줄 / 아랫줄)</p><div class="strip" style="grid-template-columns:repeat(${cols},1fr)">${r.rows.flat().map(p=>`<span data-p="${p}" class="${hl.has(p)?'hl':''}">${p}</span>`).join('')}</div>`;
  const li=r.items.map(it=>{
    const pins=it.slice(1);
    return `<li data-pins="${pins.join(',')}" class="${on(pins)?'on':''}"><i style="background:${itemColor(it[0])}"></i><b>${pins.map(circ).join('–')}</b>${it[0]}</li>`;
  }).join('');
  return `<article class="ref${active?' active':''}" data-ref="${k}"><header><h4>${r.title}</h4><span>${r.kind}</span></header>${svg}${strip}<ul>${li}</ul>${r.note?`<p class="rnote">${r.note}</p>`:''}</article>`;
}

      s+=`<rect class="cbox" x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="4"/>`;

    const mainN=WIRES.filter(w=>w.type==='main').length, mainD=WIRES.filter(w=>w.type==='main'&&wired.has(w.id)).length;
    st.innerHTML=wired.size===WIRES.length
      ? `<span class="good">배선 완료.</span> ${WIRES.length}가닥을 모두 연결했어요. 선을 눌러 경로를 다시 확인해 보세요.`
      : `<b>${wired.size}/${WIRES.length}</b>가닥 연결됨. 주회로 ${mainD}/${mainN}, 보조회로 ${wired.size-mainD}/${WIRES.length-mainN}`;
    renderSchematic(); renderSideWire();
  }
  save(); sel.fresh=null;
}

/* ================= 번호판 ================= */
const kp=$('#keypad');
function openKeypad(id,i){
  sel.slot={id,i}; render();
  const g=document.querySelector(`[data-slot="${id}:${i}"]`);
  const e=EL[id], max=COMP_MAX[e.comp], cur=(state.pins[id]||[])[i];
  kp.innerHTML=`<div class="kp-head">${e.name}<span>${i+1}/${e.ans.length}번째</span></div>
    <div class="kp-grid">${Array.from({length:max},(_,k)=>`<button data-n="${k+1}"${cur===k+1?' style="border-color:var(--sel)"':''}>${k+1}</button>`).join('')}</div>
    <div class="kp-foot"><button data-n="clear">비우기</button><button data-n="close">닫기</button></div>`;
  kp.hidden=false;
  if (g){ const r=g.getBoundingClientRect(), w=kp.offsetWidth, h=kp.offsetHeight;
    let left=r.left+r.width/2-w/2, top=r.bottom+8; if(top+h>innerHeight-8) top=r.top-h-8;
    kp.style.left=Math.max(8,Math.min(left,innerWidth-w-8))+'px'; kp.style.top=Math.max(8,top)+'px'; }
  (kp.querySelector('.kp-grid button')||kp).focus({preventScroll:true});
}
const closeKeypad=()=>{ kp.hidden=true; };
kp.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!sel.slot) return;
  const {id,i}=sel.slot, n=b.dataset.n;
  if (n==='close'){ closeKeypad(); return; }
  const arr=state.pins[id]=(state.pins[id]||[]).slice(); while(arr.length<EL[id].ans.length) arr.push(null);
  if (n==='clear'){ arr[i]=null; closeKeypad(); render(); return; }
  arr[i]=+n;
  const next=arr.findIndex((v,k)=>k>i && v==null);
  if (next>=0) openKeypad(id,next);
  else { closeKeypad(); render(); const g=document.querySelector(`[data-slot="${id}:${i}"]`); if(g) g.focus({preventScroll:true}); }
});
kp.addEventListener('keydown',e=>{ if(e.key==='Escape') closeKeypad(); });
document.addEventListener('pointerdown',e=>{ if(!kp.hidden && !kp.contains(e.target) && !e.target.closest('[data-slot]')) closeKeypad(); });
window.addEventListener('scroll',closeKeypad,{passive:true});
$('#schWrap').addEventListener('scroll',closeKeypad,{passive:true});
window.addEventListener('resize',closeKeypad);

/* ================= 이벤트 ================= */
function connect(id){ wired.add(id); sel.wire=id; sel.fresh=id; if(sel.hint===id) sel.hint=null; }
$('#sch').addEventListener('click',e=>{
  const s=e.target.closest('[data-slot]');
  if (s && state.mode==='pins'){ const [id,i]=s.dataset.slot.split(':'); openKeypad(id,+i); return; }
  const w=e.target.closest('[data-wire]');
  if (w && state.mode==='wire'){ const id=w.dataset.wire; if(!wired.has(id)) connect(id); else sel.wire=(sel.wire===id?null:id); render(); }
});
$('#sch').addEventListener('keydown',e=>{
  const s=e.target.closest('[data-slot]');
  if (s && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); const [id,i]=s.dataset.slot.split(':'); openKeypad(id,+i); }
});
$('#side').addEventListener('click',e=>{
  const ob=e.target.closest('button.opt');
  if (ob){ state.quiz[ob.dataset.q]=+ob.dataset.i; sel.q=ob.dataset.q; render(); return; }
  const qc=e.target.closest('[data-qc]');
  if (qc && !e.target.closest('button')){ sel.q=(sel.q===qc.dataset.qc?null:qc.dataset.qc); render(); return; }
  const pw=e.target.closest('.pw');
  if (pw){ sel.wire=(sel.wire===pw.dataset.wire?null:pw.dataset.wire); render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  if (b.dataset.act==='unwire'){ wired.delete(sel.wire); render(); }
  if (b.dataset.act==='wireit'){ connect(sel.wire); render(); }
  if (b.dataset.act==='big'){ state.big=!state.big; render(); }
});
$('#side').addEventListener('mouseover',e=>{
  const qc=e.target.closest('[data-qc]');
  if (qc && state.mode==='rope'){ const ref=(QUIZ.find(q=>q.id===qc.dataset.qc)||{}).ref; document.querySelectorAll('#rope .call').forEach(g=>g.classList.toggle('on', !!ref && g.dataset.call===ref)); return; }
  const li=e.target.closest('.ref li'); if(!li) return;
  refHi(li.closest('.ref'), li.dataset.pins.split(',').map(Number));
});
$('#side').addEventListener('mouseout',e=>{
  const qc=e.target.closest('[data-qc]');
  if (qc && state.mode==='rope'){ const ref=sel.q?(QUIZ.find(q=>q.id===sel.q)||{}).ref:null; document.querySelectorAll('#rope .call').forEach(g=>g.classList.toggle('on', !!ref && g.dataset.call===ref)); return; }
  const li=e.target.closest('.ref li'); if(!li) return;
  const card=li.closest('.ref'), k=card.dataset.ref;
  const act=sel.slot && REF_OF[EL[sel.slot.id].comp]===k;
  refHi(card, act?EL[sel.slot.id].ans:[]);
});
function refHi(card,pins){
  const ps=pins.map(String), key=setKey(pins);
  card.querySelectorAll('[data-p]').forEach(g=>g.classList.toggle('hl',ps.includes(g.dataset.p)));
  card.querySelectorAll('.it').forEach(g=>{ const it=g.dataset.it.split(',').map(Number); g.classList.toggle('on', pins.length>0 && setKey(it)===key); });
}
$('#tools').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if (a==='check'){ state.checked=true; ST=computeStatus(); const bad=EL_IDS.find(id=>ST[id]!=='ok'); sel.slot=bad?{id:bad,i:0}:null; render(); }
  if (a==='answer'){ EL_IDS.forEach(id=>state.pins[id]=[...EL[id].ans]); state.checked=true; sel.slot=null; render(); }
  if (a==='clearpins'){ state.pins={}; state.checked=false; sel.slot=null; closeKeypad(); render(); }
  if (a==='next'){ const w=WIRES.find(x=>!wired.has(x.id)); sel.hint=w?w.id:null; sel.wire=null; render(); }
  if (a==='wireall'){ WIRES.forEach(w=>wired.add(w.id)); sel.hint=null; sel.wire=null; render(); }
  if (a==='clearwires'){ wired.clear(); sel.hint=null; sel.wire=null; render(); }
  if (a==='qreset'){ state.quiz={}; sel.q=null; render(); }
});
document.querySelectorAll('.steps button').forEach(b=>b.addEventListener('click',()=>{ state.mode=b.dataset.mode; closeKeypad(); sel.wire=null; sel.hint=null; render(); }));
$('#resetAll').addEventListener('click',()=>{
  if(!confirm('핀번호, 제어판 배선, 요구사항 점검 진도를 모두 지우고 처음부터 시작할까요?')) return;
  state.pins={}; state.checked=false; wired.clear(); state.quiz={}; state.mode='pins';
  Object.assign(sel,{slot:null,wire:null,hint:null,q:null}); closeKeypad(); render();
});
const PGROUPS=[
  {name:'정·역 운전',nos:[1,2,3,4,5],desc:'MC1 정회전, MC2 역회전. MC2 주접점에서 L1과 L3를 바꿔 넣고, 타이머로 정회전과 역회전을 전환합니다.'},
  {name:'Y-Δ 기동',nos:[6,7],desc:'MC1이 X Y Z를 묶어 Y 결선으로 기동하고, 타이머 뒤 MC2가 Δ 결선으로 운전합니다. 전동기 단자대가 U V W와 X Y Z 2개예요.'},
  {name:'전동기 2대 순차 운전',nos:[8,9,10],desc:'MC1이 M1, MC2가 M2를 돌립니다. 타이머와 플리커 릴레이(FR)로 운전 순서와 간헐·교대 운전을 만듭니다.'}
];
const GROUP_OF=n=>PGROUPS.find(g=>g.nos.includes(n));
$('#probList').innerHTML=PGROUPS.map(g=>`<section class="pgroup${g.nos.includes(CUR_PROB)?' cur':''}"><h3>${g.name}<span class="rng">공개문제 ${g.nos[0]}~${g.nos[g.nos.length-1]}</span></h3><p>${g.desc}</p><div class="probs-list">${g.nos.map(no=>{const p=PROBLEMS.find(q=>q.no===no);return `<button data-prob="${p.no}" aria-current="${p.no===CUR_PROB}"${p.ready?'':' disabled title="준비 중"'}><span class="pn">${p.no}</span>${p.short?`<span class="pt">${p.short}</span>`:''}</button>`;}).join('')}</div></section>`).join('');
$('#probList').addEventListener('click',e=>{ const b=e.target.closest('[data-prob]'); if(!b||b.disabled||+b.dataset.prob===CUR_PROB) return; location.hash='p'+b.dataset.prob; location.reload(); });
$('#probTitle').innerHTML=`<span class="ptag">${GROUP_OF(CUR_PROB).name}</span>공개문제 ${CUR_PROB}. ${PD.title}`;
$('#ops').innerHTML=PD.OPS;
document.title=`공개문제 ${CUR_PROB} | 승강기기능사 실기 연습장`;
window.addEventListener('hashchange',()=>location.reload());
render();

</script>
</body>
</html>
